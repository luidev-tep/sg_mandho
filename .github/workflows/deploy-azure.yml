name: Deploy Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  db-migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/db
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Flyway
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flyway.tar.gz" https://github.com/flyway/flyway/releases/download/flyway-11.15.0/flyway-commandline-11.15.0-linux-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$RUNNER_TEMP"
      - name: Migrate with Microsoft Entra
        env:
          FLYWAY_URL: 'jdbc:sqlserver://sql-sg-community-536e.database.windows.net:1433;databaseName=sg_community;encrypt=true;trustServerCertificate=false;authentication=ActiveDirectoryDefault'
          FLYWAY_BASELINE_ON_MIGRATE: 'false'
        run: "$RUNNER_TEMP/flyway-11.15.0/flyway -configFiles=flyway.toml migrate"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          SHA: ${{ github.sha }}
        run: |
          az acr login --name "$ACR_NAME"
          server="$ACR_NAME.azurecr.io"
          docker build -t "$server/sg-community:$SHA" backend
          docker push "$server/sg-community:$SHA"
      - name: Update Container App
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          SHA: ${{ github.sha }}
        run: az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$ACR_NAME.azurecr.io/sg-community:$SHA"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_RECAPTCHA_ENABLED: 'true'
        run: |
          test -n "$VITE_API_URL" && test -n "$VITE_RECAPTCHA_SITE_KEY"
          pnpm build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
